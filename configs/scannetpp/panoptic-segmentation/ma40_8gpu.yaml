# Multi-View Panoptic Segmentation on ScanNet++ with Query Propagation
# 
# Configuration for: 8 × NVIDIA A40 (48GB each)
#
# Architecture:
# - MapAnything backbone (frozen) for multi-view feature extraction
# - Panoptic DPT head (trainable) for FPN-style features
# - Mask2Former with Query Propagation (trainable) for panoptic prediction
#
# IMPORTANT: IMS_PER_BATCH in this codebase is PER-GPU (not total).
# The custom build_train_loader() passes IMS_PER_BATCH directly as
# batch_size to PyTorch DataLoader, unlike standard detectron2 which
# divides by num_gpus. Each scene loads NUM_VIEWS images.
#
# Per-GPU memory budget (A40 48GB, AMP enabled):
#   1 scene × 3 views × ~6GB/view ≈ 18GB  → Safe (leaves 30GB headroom)
#   2 scenes × 3 views × ~6GB/view ≈ 36GB → Tight but feasible
#
# Effective batch size = IMS_PER_BATCH × num_gpus = 1 × 8 = 8 scenes/step
# Effective images    = 8 scenes × 3 views = 24 images/step

_BASE_: Base-ScanNetPP-PanopticSegmentation.yaml

MODEL:
  META_ARCHITECTURE: "MultiViewMask2Former"
  
  # ========================================
  # MAPANYTHING CHECKPOINT
  # ========================================
  MAPANYTHING:
    CHECKPOINT_PATH: "pretrained_models/map_anything/test"
  
  # ========================================
  # MULTI-VIEW CONFIGURATION
  # ========================================
  MULTIVIEW:
    NUM_VIEWS: 3              # Number of views per scene
    USE_POSES: True           # Use camera poses in MapAnything
    WARMUP_ITER: 2500          # Train views independently before query propagation
    
    # View selection parameters — OVERLAP-AWARE for query propagation
    # Views need 50-70% visual overlap so warped attention masks are meaningful.
    # Previous farthest-point sampling picked maximally-separated views with
    # almost zero overlap, making query propagation useless.
    MIN_CAMERA_DISTANCE: 0.3  # Minimum distance between cameras (meters) - avoid duplicates
    MAX_CAMERA_DISTANCE: 2.0  # Maximum distance — views beyond this have too little overlap
    MIN_OVERLAP: 0.2          # Minimum overlap between views (estimated)
    MAX_OVERLAP: 0.8          # Maximum overlap between views
  
  # ========================================
  # SEMANTIC SEGMENTATION HEAD
  # ========================================
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    IGNORE_VALUE: 255
    
    # Number of classes: ScanNet++ semantic_classes.txt has 2878 lines, but
    # actual panoptic labels only use category_ids 0-253 (215 unique classes).
    # NUM_CLASSES = max_category_id + 1 = 254 so that:
    #   - Valid class indices are 0..253, no-object index is 254
    #   - No collision between category_id=253 and the no-object class
    #   - 255-way softmax instead of 2879-way → classification cost is meaningful
    #   - CE gradients ~11x stronger per class
    #   - class_embed linear: 256x255 instead of 256x2879
    NUM_CLASSES: 254
    
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    
    # Pixel decoder (MSDeformAttn)
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  
  # ========================================
  # MASK2FORMER TRANSFORMER DECODER
  # ========================================
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    
    # Deep supervision during training
    DEEP_SUPERVISION: True
    
    # Loss weights: CE=5.0, Mask=2.0, Dice=5.0 (standard Mask2Former ratio)
    # Mask (BCE) at 2.0: BCE has inherent negative pressure on unmatched
    # queries (75+ of 100) AND background pixels of matched queries. Dice at
    # 5.0 (2.5x mask) counteracts this by rewarding foreground predictions.
    # NOTE: With 5:5:5 and NO transfer learning, mask logits still collapsed
    # to -12 (sigmoid≈0) — the real fix is transfer learning from single-view
    # checkpoint, not weight adjustment. 5:2:5 is the standard ratio.
    NO_OBJECT_WEIGHT: 0.1     # Weight for "no object" class
    CLASS_WEIGHT: 2.0         # Cross-entropy weight for semantic classification
    MASK_WEIGHT: 5.0          # Binary mask loss weight — lower than dice (2.5:1 ratio) to prevent BCE negative pressure from dominating
    DICE_WEIGHT: 5.0          # Dice loss weight — dominant to force foreground prediction
    
    # Transformer architecture
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100   # Max objects per image
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10            # 9 decoder layers + 1 for learnable query
    
    # Point sampling for loss computation
    TRAIN_NUM_POINTS: 12544   # 112 * 112 points (CRITICAL: prevents NaN in matcher)
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    
    # Testing thresholds
    TEST:
      SEMANTIC_ON: True
      INSTANCE_ON: True
      PANOPTIC_ON: True
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

# ========================================
# INPUT CONFIGURATION (Multi-View)
# ========================================
INPUT:
  # Depth loading DISABLED (warped attention mechanism disabled - only query propagation used)
  LOAD_DEPTH: False
  DEPTH_CACHE_DIR: null  # Not used when LOAD_DEPTH is False
  
  # Image size - REDUCED for A40 memory (48GB with 3 views per scene)
  # Original DSLR images are ~4000x6000, these get resized
  MIN_SIZE_TRAIN: (384, 416, 448, 480)  # Smaller range for memory
  MAX_SIZE_TRAIN: 640                    # Reduced from 800
  MIN_SIZE_TEST: 480
  MAX_SIZE_TEST: 640
  FORMAT: "RGB"
  
  DATASET_MAPPER_NAME: "scannetpp_multiview"

# ========================================
# TRAINING SCHEDULE (8 × A40 48GB)
# ========================================
#
# CRITICAL: IMS_PER_BATCH is PER-GPU in this codebase (custom build_train_loader).
# Standard detectron2 divides by num_gpus, but our custom DataLoader does NOT.
#
# Per-step computation:
#   Per GPU:  IMS_PER_BATCH scenes × NUM_VIEWS views = 1 × 3 = 3 images
#   Total:    1 scene/GPU × 8 GPUs = 8 scenes/step (24 images)
#
# Training duration:
#   Dataset: 150 train scenes
#   Epochs:  22500 iter × 8 scenes/iter = 180k scene-iterations = 1200 epochs
#   This matches standard Mask2Former training on COCO (~300k iter, BS=16)
#
SOLVER:
  IMS_PER_BATCH: 4            # 1 scene PER GPU (= 3 images with NUM_VIEWS=3)
                              # Effective batch: 1 × 8 GPUs = 8 scenes/step (24 images)
  BASE_LR: 0.0001             # 1e-4 — standard for effective batch size 8 scenes
  DPT_LR: 0.00001             # 1e-5 — 10x lower for pretrained DPT weights
  MAX_ITER: 11250             # 22.5k iter × 8 scenes/iter = 180k scene-iterations
  
  # Learning rate schedule
  STEPS: (6500, 10000)       # Decay at 67% and 89% of training
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 1000          # Warm up LR from 1e-7 → 1e-4 over 1000 iters
  
  # Gradient clipping for stability
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "norm"
    CLIP_VALUE: 5.0           # Standard Mask2Former value
    NORM_TYPE: 2.0
  
  CHECKPOINT_PERIOD: 2000     # Save every 2.5k iter (~20k scenes between saves)

DATALOADER:
  NUM_WORKERS: 8              # 4 workers per GPU (32 CPUs / 8 GPUs = 4 per GPU)

TEST:
  EVAL_PERIOD: 0              # Disabled (missing merged GT JSON causes crash)
  DETECTIONS_PER_IMAGE: 100

OUTPUT_DIR: "./output_multiview_8mlsp0"

# AMP is force-enabled in setup_cfg() — no need to set here
